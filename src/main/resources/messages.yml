  invalid-name: "<#A8D5A2>Use a name of 1–48 lowercase letters, numbers, underscores or hyphens</#A8D5A2>."
help:
  lines: |-
    <#F3E5AB>Atlas</#F3E5AB>
    <#A8D5A2>/atlas world</#A8D5A2> <#A8D5A2>list, create, import, enable, disable, delete, clone, reset, pending, cancel</#A8D5A2>
    <#A8D5A2>/atlas info {world}</#A8D5A2> — state, settings and flags
    <#A8D5A2>/atlas tp {world} [player]</#A8D5A2>, <#A8D5A2>/atlas spawn [world] [player]</#A8D5A2>, <#A8D5A2>/atlas setspawn</#A8D5A2>
    <#A8D5A2>/atlas flag {world} {flag} {on|off|default}</#A8D5A2>
    <#A8D5A2>/atlas set {world} {difficulty|gamemode|time|weather} {value}</#A8D5A2>
    <#A8D5A2>/atlas selector</#A8D5A2>, <#A8D5A2>/atlas portal</#A8D5A2>, <#A8D5A2>/atlas keeploaded</#A8D5A2>, <#A8D5A2>/atlas reload</#A8D5A2>
usage:
  world: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas world list | create {name} {generator} | import {name} {generator} | enable {world} | disable {world} | delete {world} confirm | clone {source} {name} | reset {world} [source] confirm | pending | cancel {id}</#A8D5A2>"
  info: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas info {world}</#A8D5A2>"
  tp: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas tp {world} [player]</#A8D5A2>"
  spawn: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas spawn [world] [player]</#A8D5A2>"
  setspawn: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas setspawn [world]</#A8D5A2>"
  flag: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas flag {world} {flag} {on|off|default}</#A8D5A2>"
  set: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas set {world} {difficulty|gamemode|time|weather} {value}</#A8D5A2>"
  portal: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas portal create {name} {world} | delete {name} | list | info {name} | target {name} (spawn {world} | here | server {region} {world} [x y z [yaw pitch]]) | cooldown {name} {millis} | sound {name} {key|none} | particle {name} {particle|none} | restrict {name} {on|off} | fill {name} {block|none}</#A8D5A2>"
  keeploaded: "<#F3E5AB>Usage:</#F3E5AB> <#A8D5A2>/atlas keeploaded set {name} | delete {name} | list</#A8D5A2>"
