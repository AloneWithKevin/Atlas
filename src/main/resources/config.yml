# Atlas uses exact Postbox server IDs, independently of geographic region.
server:
  # Must exactly match Postbox server.id on this installation.
  id: "Hub01"
  # Explicit server ID -> Velocity backend name. Include the local member.
  proxy-names:
    Hub01: "Hub01"
    Survival01: "Survival01"
database:
  host: "127.0.0.1"
  port: 3306
  name: "pixelretreat_veyra"
  username: ""
  password: ""
  ssl-mode: "disable"
datapack:
  # Data pack format of the running Minecraft version (26.3: 121).
  pack-format: 121
teleport:
  # Blocks around a world spawn searched for a safe landing spot.
  safe-search-radius: 16
portals:
  # Cooldown for new portals, in milliseconds.
  default-cooldown-millis: 2500
  # How long a cross-server travel ticket stays valid.
  travel-ticket-minutes: 5
  # Largest portal volume that may be filled with blocks.
  max-fill-blocks: 4096
keep-loaded:
  # Largest number of chunks one keep-loaded region may cover.
  max-chunks-per-region: 1024
# Flag values for worlds that do not override them.
default-flags:
  hostile-mobs: true
  friendly-mobs: true
  plugin-hostile-mobs: true
  plugin-friendly-mobs: true
  tnt-damage: true
  crystal-damage: true
  fire-damage: true
  explosion-damage: true
  pvp: true
  fall-damage: true
  hunger: true
  drowning: true
  block-break: true
  block-place: true
  leaf-decay: true
  crop-trampling: true
  item-drop: true
  item-pickup: true
  weather: true
  time-cycle: true
  time-skip: true
  mob-griefing: true
  keep-inventory: false
  portals: true
  trading: true
workers:
  threads: 4
  queue-size: 256
# Owner-approved source admission limits; pending facts and future terminal holds share this bound.
logbook:
  maximum-pending: 100000
  maximum-fact-bytes: 32768
